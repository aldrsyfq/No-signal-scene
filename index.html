<!DOCTYPE html>
<html style="background-color: blue; color: white;" lang="en">

<head>
    <title>My Web Page</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .html {
            background-color: blue;
        }

        h1 {
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 1);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -100%);
            font-weight: normal;
            user-select: none;
            font-size: 4rem;
            font-family: 'Arial', sans-serif;
        }
    </style>
</head>

<body>
    <h1>无信号</h1>
    <div id="fs-overlay" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);z-index:9998;visibility:hidden">
        <button id="fs-enter" style="font-size:1.25rem;padding:1rem 1.5rem;border-radius:8px;border:none;">Enter fullscreen</button>
    </div>
    <audio id="bg-audio" src="无信号.mp3" preload="auto" style="display:none"></audio>
    <!-- PLAY AUDIO -->
    <script>
        window.addEventListener('load', function () {
            var audio = document.getElementById('bg-audio');
            if (!audio) return;
            audio.loop = true;
            var playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(function () {
                    var btn = document.createElement('button');
                    btn.textContent = 'Play audio';
                    btn.style.position = 'fixed';
                    btn.style.right = '12px';
                    btn.style.bottom = '12px';
                    btn.style.zIndex = 9999;
                    btn.onclick = function () {
                        audio.play();
                        btn.remove();
                    };
                    document.body.appendChild(btn);
                });
            }
        });
    </script>
    <!-- FULLSCREEN TOGGLE -->
    <script>
        (function() {
            var holdDuration = 1000; // ms
            var startTime = 0;
            var moved = false;
            var touchId = null;

            function onStart(e) {
                if (document.fullscreenElement) return;
                if (e.type === 'mousedown' && e.button !== 0) return;
                moved = false;
                startTime = Date.now();
                if (e.type === 'touchstart' && e.changedTouches && e.changedTouches.length) {
                    touchId = e.changedTouches[0].identifier;
                } else {
                    touchId = null;
                }
            }

            function onMove() {
                moved = true;
            }

            function onEnd(e) {
                if (document.fullscreenElement) return;
                var endTime = Date.now();
                var elapsed = endTime - startTime;

                if (e.type === 'touchend' && e.changedTouches && touchId !== null) {
                    var found = false;
                    for (var i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchId) { found = true; break; }
                    }
                    if (!found) return;
                }

                if (!moved && startTime && elapsed >= holdDuration) {
                    var el = document.documentElement;
                    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
                    if (req) req.call(el).catch(function(){});
                }

                startTime = 0;
                moved = false;
                touchId = null;
            }

            window.addEventListener('touchstart', onStart, { passive: true });
            window.addEventListener('mousedown', onStart, { passive: true });
            window.addEventListener('touchmove', onMove, { passive: true });
            window.addEventListener('mousemove', onMove, { passive: true });
            window.addEventListener('touchcancel', function() { startTime = 0; moved = false; touchId = null; }, { passive: true });
            window.addEventListener('touchend', onEnd, { passive: true });
            window.addEventListener('mouseup', onEnd, { passive: true });
        })();
    </script>

    <!-- Try entering fullscreen on load; if blocked, show overlay button -->
    <script>
        (function() {
            function requestFS() {
                var el = document.documentElement;
                var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
                if (!req) return Promise.reject(new Error('Fullscreen API not supported'));
                return req.call(el);
            }

            window.addEventListener('load', function() {
                var overlay = document.getElementById('fs-overlay');
                var enterBtn = document.getElementById('fs-enter');

                requestFS().then(function() {
                    if (overlay) overlay.style.visibility = 'hidden';
                }).catch(function() {
                    if (overlay) overlay.style.visibility = 'visible';
                });

                if (enterBtn) {
                    enterBtn.addEventListener('click', function() {
                        requestFS().then(function() {
                            if (overlay) overlay.style.visibility = 'hidden';
                        }).catch(function(){});
                    });
                }
            });
        })();
    </script>
</body>

</html>
